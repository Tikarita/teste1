# Publicação gratuita no Render: site e API num serviço só, sem a IA
# (o plano free tem 512 MB e a IA precisa de cerca de 2 GB).
# Para criar: Render -> New -> Blueprint -> este repositório.
services:
  - type: web
    name: aktia
    runtime: docker
    dockerfilePath: ./deploy/docker/Dockerfile.sem-ia
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Preenchidas no painel do Render; nunca ficam no repositório.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
